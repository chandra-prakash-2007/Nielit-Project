<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Two Numbers</title>
</head>
<body>
    <h1>Add Two Numbers</h1>

    <label for="number1">First number:</label>
    <input type="number" id="number1" placeholder="Enter first number">

    <label for="number2">Second number:</label>
    <input type="number" id="number2" placeholder="Enter second number">

    <button onclick="document.getElementById('result').textContent = 'Result: ' + (Number(document.getElementById('number1').value) + Number(document.getElementById('number2').value));">Add</button>
    <p id="result">Result: </p>
</body>
</html>
